<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Voyages – Explorer le monde</title>

    <!-- Police Google Fonts : Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Si tu utilises un framework CSS (Bootstrap, Tailwind…), ajoute son lien ICI, AVANT style.css -->
    <link rel="stylesheet" href="output.css"/>

    <!-- defer : le script s'exécute une fois le HTML chargé -->
    <script src="script.js" type="module"></script>
  </head>
  <body>
    <header class="bg-[#0F4C81] p-6">
      <p class="text-[#FFFFFF] text-2xl">Atlas Voyages</p>
    </header>
    <main class="grid grid-cols-1 p-6 gap-6">
      <header>
        <h1>Explorer le monde</h1>
        <small>Choisis un continent, parcours les pays et trouve ta prochaine destination.</small>
      </header>
      <section class="grid grid-cols-1 gap-4">
        <div class="grid grid-cols-1 gap-2">
          <label for="continent" class="text-[#1A2433]">Continent</label>
          <select name="" id="continent" class="bg-[#FFFFFF] rounded-2xl border-2 h-12 p-3">
            <option value="Choisissez un continent" disabled selected>Choisissez un continent</option>
          </select>
        </div>
        <div class="grid grid-cols-1 gap-2">
          <label for="pays" class="text-[#1A2433]">Rechercher un pays</label>
          <input type="search" value="Ex. : Morocco" class="bg-[#FFFFFF] rounded-2xl border-2 h-12 p-3">
          </select>
        </div>
        <button class="bg-[#0F4C81] h-12 rounded-xl text-[#FFFFFF]">Trier par population</button>
      </section>
      <section id="country-list">
        <article class="border-2 rounded-2xl p-4">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/5c/Flag_of_the_Taliban.svg" 
            alt=""
            class="w-fit rounded-2xl">
          <h2 class="text-2xl font-bold">Morocco</h2>
          <div class="flex justify-between items-center">
            <p>Capitale</p>
            <p>Rabat</p>
          </div>
          <div class="flex justify-between items-center">
            <p>Population</p>
            <p>37 457 971</p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
